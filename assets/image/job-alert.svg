    <g transform="translate(260, 65)">
      <rect width="205" height="130" rx="10" fill="#161B27" stroke="rgba(212,175,55,0.45)" stroke-width="1" />
      <rect x="12" y="12" width="28" height="28" rx="6" fill="url(#jaGold)" />
      <text x="26" y="30" fill="#0A0A0A" font-family="'Inter', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">✦</text>
      <text x="48" y="30" fill="#F1F5F9" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Gemini AI Parser</text>
      <text x="14" y="62" fill="#D4AF37" font-family="'JetBrains Mono', monospace" font-size="11">&gt; Summarize role &amp; skills</text>
      <text x="14" y="82" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">&gt; Relevance scoring: 98%</text>
      <text x="14" y="102" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">&gt; Match: AI / Python roles</text>
      <text x="14" y="124" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10">● Synthesis Complete</text>
    </g>

    <!-- Flow Arrow 2 -->
