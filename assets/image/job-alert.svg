    <circle cx="60" cy="21" r="5.5" fill="#10B981" opacity="0.85" />
    <text x="340" y="26" fill="#A0AEC0" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" text-anchor="middle" letter-spacing="1">AI JOB ALERT ASSISTANT • AUTOMATION PIPELINE</text>

    <!-- Step 1: Multi-API Job Harvester -->
    <g transform="translate(24, 65)">
      <rect width="195" height="130" rx="10" fill="#141824" stroke="rgba(56,189,248,0.3)" stroke-width="1" />
      <rect x="12" y="12" width="28" height="28" rx="6" fill="url(#jaCyan)" />
      <text x="26" y="31" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="bold" font-size="14" text-anchor="middle">📡</text>
      <text x="48" y="30" fill="#F1F5F9" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Multi-API Fetch</text>
      <text x="14" y="62" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">● Adzuna API</text>
      <text x="14" y="82" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">● JSearch RapidAPI</text>
      <text x="14" y="102" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">● Jooble Portal</text>
      <text x="14" y="124" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">Merged &amp; Deduplicated</text>
    </g>

    <!-- Flow Arrow 1 -->
    <path d="M 225 130 L 255 130" stroke="#D4AF37" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 2" />

