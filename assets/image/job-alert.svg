      <text x="18" y="30" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12">$ python -m src.job_crawler --run-pipeline</text>
      <text x="18" y="55" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">[2026-11-17 08:00:02] [INFO] Querying Adzuna, JSearch, and Jooble endpoints...</text>
      <text x="18" y="77" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">[2026-11-17 08:00:04] [SUCCESS] Fetched 142 listings | Deduplicated: 86 unique opportunities</text>
      <text x="18" y="99" fill="#D4AF37" font-family="'JetBrains Mono', monospace" font-size="11">[2026-11-17 08:00:06] [GEMINI AI] Generating structured digest for AI Engineer roles...</text>
      <text x="18" y="121" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11">[2026-11-17 08:00:08] [SMTP] Rendering responsive HTML email template with job cards</text>
      <text x="18" y="143" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">[2026-11-17 08:00:09] [SUCCESS] Job alert broadcast dispatched successfully via Gmail SMTP (Status: 250 OK)</text>
      <text x="18" y="165" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">&gt; Pipeline completed in 7.42s | Next automated run scheduled</text>
