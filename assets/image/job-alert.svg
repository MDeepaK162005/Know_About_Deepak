      <text x="26" y="30" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="bold" font-size="13" text-anchor="middle">✉</text>
      <text x="48" y="30" fill="#F1F5F9" font-family="'Inter', sans-serif" font-weight="600" font-size="13">Email Dispatch</text>
      <text x="14" y="62" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">● Cron: Scheduled</text>
      <text x="14" y="82" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">● GitHub Actions</text>
      <text x="14" y="102" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">● Gmail SMTP</text>
      <text x="14" y="124" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="10">HTML Alert Sent ✓</text>
